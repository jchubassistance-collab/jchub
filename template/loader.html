<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JcHub - Chargement</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #eff6ff;
            font-family: 'Poppins', sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Conteneur du logo */
        .logo-wrapper {
            position: relative;
            width: 100px;
            height: 100px;
        }

        .logo-box {
            width: 100%;
            height: 100%;
            background: #2563eb;
            border-radius: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 
                0 20px 40px rgba(37, 99, 235, 0.3),
                0 8px 20px rgba(37, 99, 235, 0.2);
            animation: pulseLogo 2s ease-in-out infinite;
        }

        .logo-box span {
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            font-size: 52px;
            color: #ffffff;
            letter-spacing: -0.02em;
        }

        @keyframes pulseLogo {
            0%, 100% { 
                transform: scale(1); 
                box-shadow: 
                    0 20px 40px rgba(37, 99, 235, 0.3),
                    0 8px 20px rgba(37, 99, 235, 0.2);
            }
            50% { 
                transform: scale(1.05); 
                box-shadow: 
                    0 25px 50px rgba(37, 99, 235, 0.4),
                    0 12px 25px rgba(37, 99, 235, 0.25);
            }
        }

        /* Anneau rotatif autour du logo */
        .ring {
            position: absolute;
            inset: -12px;
            border-radius: 40px;
            border: 2px dashed rgba(37, 99, 235, 0.35);
            animation: spinRing 8s linear infinite;
            pointer-events: none;
        }

        @keyframes spinRing {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- Logo animé avec anneau rotatif -->
    <div class="logo-wrapper">
        <div class="ring"></div>
        <div class="logo-box">
            <span>J</span>
        </div>
    </div>

</body>
</html>
